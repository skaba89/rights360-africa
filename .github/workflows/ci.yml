name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: API unit tests
        working-directory: backend
        run: python -m pytest -v --junitxml=test-results.xml --cov=app --cov-report=xml --cov-report=term
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
  docker:
    env:
      POSTGRES_PASSWORD: ci-ephemeral-only
      RUNTIME_DB_PASSWORD: ci-runtime-ephemeral-distinct-only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Docker environment
        run: |
          docker version
          docker compose version
      - name: Generate ephemeral MFA key
        run: |
          key=$(openssl rand -base64 32 | tr '/+' '_-')
          echo "::add-mask::$key"
          echo "MFA_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build image
        run: docker compose build
      - name: Start and wait for health
        run: docker compose up -d --wait --wait-timeout 120
      - name: HTTP smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-connrefused --max-time 10 http://127.0.0.1:8500/healthz
      - name: Database readiness
        run: curl --fail --silent --show-error http://127.0.0.1:8500/readyz
      - name: Verify migration
        run: docker compose exec -T db psql -U rights360 -d rights360 -v ON_ERROR_STOP=1 -c 'SELECT id, slug, name FROM organizations LIMIT 0;'
      - name: Tenant isolation checks
        run: docker compose exec -T db psql -U rights360 -d rights360 -v ON_ERROR_STOP=1 < backend/tests/tenant_isolation.sql
      - name: Authentication integration checks
        run: |
          docker compose run --rm --no-deps -T --user 0 -v "${PWD}/backend:/workspace:ro" -w /workspace migrate sh -c 'python -m pip install --no-cache-dir -r requirements-dev.txt && PYTHONPATH=/workspace python tests/auth_integration.py'
      - name: Legal module integration checks
        run: |
          docker compose run --rm --no-deps -T --user 0 -e RIGHTS360_DISPOSABLE_E2E=1 -v "${PWD}/backend:/workspace:ro" -w /workspace migrate sh -c 'python -m pip install --no-cache-dir -r requirements-dev.txt && PYTHONPATH=/workspace python tests/legal_integration.py'
      - name: Rights-advanced integration checks
        run: |
          docker compose run --rm --no-deps -T --user 0 -e RIGHTS360_DISPOSABLE_E2E=1 -v "${PWD}/backend:/workspace:ro" -w /workspace migrate sh -c 'python -m pip install --no-cache-dir -r requirements-dev.txt && PYTHONPATH=/workspace python tests/rights_integration.py'
      - name: Session cap integration checks
        run: |
          docker compose run --rm --no-deps -T --user 0 -e RIGHTS360_DISPOSABLE_E2E=1 -v "${PWD}/backend:/workspace:ro" -w /workspace migrate sh -c 'python -m pip install --no-cache-dir -r requirements-dev.txt && PYTHONPATH=/workspace python tests/session_integration.py'
      - name: Validate operations scripts and isolated restore
        run: |
          for script in ops/*.sh; do bash -n "$script"; done
          secret_dir=$(mktemp -d)
          chmod 700 "$secret_dir"
          trap 'rm -rf "$secret_dir"' EXIT
          umask 077
          printf 'POSTGRES_PASSWORD=%s\nRUNTIME_DB_PASSWORD=%s\nMFA_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$MFA_ENCRYPTION_KEY" > "$secret_dir/rec.env"
          bash ops/preflight.sh rec "$secret_dir/rec.env"
          bash ops/preflight.sh prod "$secret_dir/rec.env"
          docker compose exec -T db pg_dump -U rights360 -d rights360 -Fc > "$secret_dir/test.dump"
          (cd "$secret_dir"; sha256sum test.dump > test.dump.sha256)
          bash ops/verify-restore.sh "$secret_dir/test.dump"
      - name: Browser offline qualification
        timeout-minutes: 4
        run: |
          npm install --prefix /tmp/rights360-browser --no-audit --no-fund playwright@1.56.1
          /tmp/rights360-browser/node_modules/.bin/playwright install chromium
          NODE_PATH=/tmp/rights360-browser/node_modules node backend/tests/offline_browser.cjs
      - name: Authenticated business browser E2E
        timeout-minutes: 4
        run: |
          umask 077
          fixture=$(mktemp)
          trap 'rm -f "$fixture"' EXIT
          docker compose run --rm --no-deps -T -e RIGHTS360_DISPOSABLE_E2E=1 -v "${PWD}/backend:/workspace:ro" -w /workspace migrate sh -c 'PYTHONPATH=/workspace python tests/seed_browser_e2e.py' > "$fixture"
          RIGHTS360_E2E_FIXTURE="$fixture" NODE_PATH=/tmp/rights360-browser/node_modules node backend/tests/business_browser.cjs
      - name: Admin MFA enrollment browser E2E
        timeout-minutes: 4
        run: |
          umask 077
          fixture=$(mktemp)
          trap 'rm -f "$fixture"' EXIT
          docker compose run --rm --no-deps -T -e RIGHTS360_DISPOSABLE_E2E=1 -v "${PWD}/backend:/workspace:ro" -w /workspace migrate sh -c 'PYTHONPATH=/workspace python tests/seed_admin_e2e.py' > "$fixture"
          RIGHTS360_E2E_FIXTURE="$fixture" NODE_PATH=/tmp/rights360-browser/node_modules node backend/tests/admin_browser.cjs
      - name: Capture container diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          docker compose ps -a > diagnostics/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > diagnostics/compose-logs.txt 2>&1 || true
          cat diagnostics/compose-ps.txt diagnostics/compose-logs.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-diagnostics
          path: diagnostics/
      - name: Cleanup
        if: always()
        run: docker compose down
