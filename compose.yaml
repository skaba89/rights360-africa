services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8500:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
