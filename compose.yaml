services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rights360
      POSTGRES_DB: rights360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rights360", "-d", "rights360"]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    build: ./backend
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD in .env}
    command: ["sh", "-c", "python -m app.provision_runtime && alembic upgrade head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment:
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8500:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  db-data:
